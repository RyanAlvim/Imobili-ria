    <div class="container-fluid py-4">
      <div class="row">
        <div class="col-md-16">
          <div class="card">
            <div class="card-header pb-0">
              <div class="d-flex align-items-center">
                <p class="mb-0">Cadastro de Negócios</p>
              </div>
            </div>
            <form action="" method="post">
            <div class="card-body">
              <div class="row">
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">Nome de Usuário</label>
                    <select class="form-select" aria-label="Disabled select example" name="email">
                    	<option th:each="nomeUser : ${nomes}" th:if="${nomeUser.cargo == 'CORRETOR'}" th:text="${nomeUser.nome}" th:value="${nomeUser.email}"></option>
                    </select>
                  </div>
                </div>
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">Tipo de Negócio</label>
                    <select class="form-select" aria-label="Disabled select example" name="tipoNegocio">
                     <option th:value="Rede" th:text="Rede">
                     <option th:value="Venda" th:text="Venda">
                     <option th:value="Aluguel" th:text="Aluguel">
                     </select>
                  </div>
                </div>
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">pv</label>
                    <input class="form-control" type="text" name="pv">
                  </div>
                </div>
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">Nome do Imóvel</label>
                    <input class="form-control" type="text" name="nome">
                  </div>
                
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">Referência de imóvel</label>
                    <input class="form-control" type="text" name="referencia_imovel">
                  </div>
                </div>
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">Endereço do Imóvel</label>
                    <input class="form-control" type="text" name="endereco_imovel">
                  </div>
                </div>
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">Valor do Negócio ($)</label>
                    <input class="form-control" id="valor_negocio" type="text" name="valor_negocio" placeholder="Valor do Negócio ($)">
                  </div>
                </div>
                
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">Tipo da Comissão</label>
                    <select class="form-select" aria-label="Disabled select example" id="tipo_comissao" name="tipo_comissao">
                     <option th:value="Rede" th:text="Rede">
                     <option th:value="Direta" th:text="Direta">
                     <option th:value="Gestao" th:text="Gestão">
                     <option th:value="Exclusividade" th:text="Exclusividade">
                     </select>
                  </div>
                </div>
                
                
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">Gerente ($)</label>
                    <input class="form-control" type="text" id="gerente" name="gerente" placeholder="Valor do Gerente ($)">
                  </div>
                </div>
                
                
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">Rede (%)</label>
                    <input class="form-control" type="text" id="rede" name="rede" placeholder="Porcentagem da Rede (%)">
                  </div>
                </div>
                
                
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">Royalties,Nf,Impostos,etc... ($)</label>
                    <input class="form-control" type="text" id="royalties_nf_impostos" name="royalties_nf_impostos" placeholder="Valor do Royalties,Nf,Impostos,etc... ($)">
                  </div>
                </div>
                
                
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">Vistoria ($)</label>
                    <input class="form-control" type="text" id="vistoria" name="vistoria" placeholder="Valor da Vistoria ($)">
                  </div>
                </div>
                
                
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">Data prevista para pagamento</label>
                    <input class="form-control" type="date" name="data_prevista_pagamento">
                  </div>
                </div>
                
               
                
                
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">Data de assinatura</label>
                    <input class="form-control" type="date" name="data_assinatura">
                  </div>
                </div>
                
                
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">Corretor (%)</label>
                    <input class="form-control" type="text" id="corretor" name="porcentagem" placeholder="Porcentagem do Corretor (%)">
                  </div>
                </div>
                
                
                
                <div class="col-md-12" id="gestao_prct">
                  <div class="form-group">
                    <label for="example-text-input" class="form-control-label">Porcentagem da Gestão (%)</label>
                    <input class="form-control" type="text" id="porcentagem_gestao" name="porcentagem_gestao" placeholder="Porcentagem da Gestão (%)">
                  </div>
                </div>
                
              </div>
              <hr class="horizontal dark">
                <button type="submit" class="btn btn-success">Cadastrar</button>
                <button type="button" onclick="Calcular()" class="btn btn-primary">Calcular</button>
                <button type="button" onclick="AdicionarCamposEspeciais()" class="btn btn-secondary">Calcular Gestão</button>
                
            </div>
           <h3>TOTAL: <span id="total"></span></h3>
            <h3>REDE: <span id="redes"></span></h3>
             <h3>SALDO: <span id="sobra"></span></h3>
              <h3>Royalties,NF,Impostos,Jurídico...: <span id="custos"></span></h3>
              <h3>Vistoria: <span id="vistoria_total"></span></h3>
              <h3>DISTRIBUIÇÃO: <span id="distribuicao"></span></h3>
              <h3>CORRETOR: <span id="corretor_comissao"></span></h3>
              <h3>GERENTE: <span id="gerentes"></span></h3>
              <h3>EMPRESA: <span id="empresa"></span></h3>
            </form>
          </div>
        </div>
        
      </div>
      
    </div>
  </div>
  
  
  <script>
  
  document.getElementById("gestao_prct").style.display = "none"
	    function AdicionarCamposEspeciais(){
	      if(document.querySelector('#tipo_comissao').value == "Gestao"){
	        document.getElementById("gestao_prct").style.display = "block"
	      }
	    }
  
  
  	function RetornarCampo(){
  		return document.querySelector("#porcentagem_gestao").value
  	}
  
  	function Calcular(){
  		
  		var valor_negocio = document.querySelector('#valor_negocio').value
  		var gerente = document.querySelector("#gerente").value
  		var rede = document.querySelector("#rede").value
  		var royalties_nf_impostos = document.querySelector("#royalties_nf_impostos").value
  		var vistoria = document.querySelector("#vistoria").value
  		var corretor = document.querySelector("#corretor").value
  		var porcentagem_gestao = document.querySelector("#porcentagem_gestao").value
  		var tipo_comissao = document.querySelector("#tipo_comissao").value
  		
  		console.log(tipo_comissao)
  		
  		
  		console.log(valor_negocio)
  		console.log(gerente)
  		console.log(rede)
  		console.log(royalties_nf_impostos)
  		console.log(vistoria)
  		console.log(corretor)
  		console.log(porcentagem_gestao)
  		console.log("--------------------")
  		var calculo1 = valor_negocio - (valor_negocio * rede / 100)
  		var calcular_rede = valor_negocio - calculo1
  		var calcular_custos = calculo1 - royalties_nf_impostos;
  		var calcular_vistoria = calcular_custos - vistoria;
  		
  		console.log("Valor Total: " + valor_negocio)
  		console.log("Rede: " + calcular_rede)
  		console.log("Saldo: " + calculo1)
  		console.log("Royalties,NF,Impostos,Jurídico...: " + royalties_nf_impostos)
  		console.log("Vistoria: " + vistoria)
  		console.log("Distribuidor " + calcular_vistoria)
  		
  		var calcular_corretores;
  		var calc_corretor;
  		var calcular_empresa;
  		var calc_empresa;
  		if(tipo_comissao == "Rede"){
  			calcular_corretores = calcular_vistoria * corretor * 0.01
  			calc_corretor = calcular_corretores.toFixed(2)
  			console.log("Corretor: " + calcular_corretores)
  			console.log("Gerente: " + gerente)
  			calcular_empresa = calcular_vistoria - calcular_corretores - gerente
  			calc_empresa = calcular_empresa.toFixed(2)
  			console.log("Empresa: " + calcular_empresa)
  			
  		}
  		if(tipo_comissao == "Direta"){
  			calcular_corretores = calcular_vistoria * corretor * 0.01
  			calc_corretor = calcular_corretores.toFixed(2)
  			console.log("Corretor: " + calcular_corretores)
  			console.log("Gerente: " + gerente)
  			calcular_empresa = calcular_vistoria - calcular_corretores - gerente
  			calc_empresa = calcular_empresa.toFixed(2)
  			console.log("Empresa: " + calcular_empresa)
  		}
  		if(tipo_comissao == "Gestao"){
  			calcular_porcentagem2 = parseInt(corretor) + parseInt(RetornarCampo())
  			calcular_corretores = calcular_vistoria * calcular_porcentagem2 * 0.01
  			calc_corretor = calcular_corretores.toFixed(2)
  			console.log("Corretor: " + calcular_corretores)
  			console.log("Gerente: " + gerente)
  			calcular_empresa = calcular_vistoria - calcular_corretores - gerente
  			calc_empresa = calcular_empresa.toFixed(2)
  			console.log("Empresa: " + calcular_empresa)
  		}
  		if(tipo_comissao == "Exclusividade"){
  			calcular_corretores = calcular_vistoria * corretor * 0.01
  			calc_corretor = calcular_corretores.toFixed(2)
  			console.log("Corretor: " + calcular_corretores)
  			console.log("Gerente: " + gerente)
  			calcular_empresa = calcular_vistoria - calcular_corretores - gerente
  			calc_empresa = calcular_empresa.toFixed(2)
  			console.log("Empresa: " + calcular_empresa)
  		}
  		
  		document.getElementById("redes").innerHTML = calcular_rede;
        document.getElementById("sobra").innerHTML = calculo1;
       document.getElementById("custos").innerHTML = royalties_nf_impostos;
       document.getElementById("vistoria_total").innerHTML = vistoria;
       document.getElementById("distribuicao").innerHTML = calcular_vistoria;
       document.getElementById("corretor_comissao").innerHTML = calc_corretor;
       document.getElementById("empresa").innerHTML = calc_empresa;
       document.getElementById("gerentes").innerHTML = gerente;
       document.getElementById("total").innerHTML = valor_negocio;
  	}
  
  </script>
  
  <!--   Core JS Files   -->
  <script src="../assets/js/core/popper.min.js"></script>
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/plugins/perfect-scrollbar.min.js"></script>
  <script src="../assets/js/plugins/smooth-scrollbar.min.js"></script>

    var win = navigator.platform.indexOf('Win') > -1;

      var options = {
        damping: '0.5'
      }
      Scrollbar.init(document.querySelector('#sidenav-scrollbar'), options);
    }
  </script>

</body>
